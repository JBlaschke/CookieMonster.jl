name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          # macos-latest runners are Apple Silicon, so Julia must be aarch64.
          - os: macos-latest
            arch: aarch64
            version: '1.10'
          - os: macos-latest
            arch: aarch64
            version: '1.12'
          - os: macos-latest
            arch: aarch64
            version: 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  # Separate opt-in job: drives a real headless Chromium (Playwright) to write a
  # known cookie, then checks CookieMonster reads it back. Linux-only, because it
  # relies on Chromium's keyring-free "peanuts" v10 store (--password-store=basic).
  # Kept out of the main matrix so a browser/format change can't red-herring the
  # unit tests.
  #
  # This job also produces the coverage report: with COOKIEMONSTER_E2E=1 the
  # test run includes both the unit suite and the browser round-trip, so its
  # .cov files are the *combined* coverage. One matrix cell aggregates them,
  # posts a per-file table to the job summary, and fails below the floor.
  e2e:
    name: E2E browser - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          COOKIEMONSTER_E2E: '1'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.10'
      - name: Coverage summary + gate
        if: matrix.version == '1.10'
        run: julia .github/coverage_gate.jl lcov.info 90
